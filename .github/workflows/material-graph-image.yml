name: Publish immutable GHCR image

on:
  workflow_run:
    workflows: ['Material Graph CI']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: material-graph-image-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, attest, and publish exact commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Validate immutable source revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "IMAGE_TAG=sha-$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Check out exact verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Require a publishable Material Graph HMAC contract lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import re

          lock = json.loads(
              Path("contracts/openwebui/hmac-v1.source.json").read_text(encoding="utf-8")
          )
          source_commit = str(lock.get("source_commit", ""))
          if lock.get("publishable") is not True:
              raise SystemExit("HMAC contract source lock is explicitly non-publishable")
          if source_commit == "PENDING_MASTER_SQUASH":
              raise SystemExit("HMAC contract source commit is still pending")
          if re.fullmatch(r"[0-9a-f]{40}", source_commit) is None:
              raise SystemExit("HMAC contract source commit is not immutable")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR with GitHub token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            BUILD_HASH=${{ env.SOURCE_SHA }}
            UID=10001
            GID=10001
            UV_VERSION=0.11.32
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Block high and critical vulnerabilities with Grype
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          severity-cutoff: high
          fail-build: true
          only-fixed: false
          output-format: table

      - name: Generate SPDX SBOM from published image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest build provenance with GitHub OIDC
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM with GitHub OIDC
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keylessly sign the immutable digest
        shell: bash
        run: cosign sign --yes "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ env.SOURCE_SHA }}
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

  verify-public:
    name: Verify public digest and keyless signature without registry credentials
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Prepare an empty Docker credential boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          repository="${GITHUB_REPOSITORY,,}"
          anonymous_docker_config="$RUNNER_TEMP/anonymous-docker"
          mkdir -p "$anonymous_docker_config"
          printf '{"auths":{}}\n' > "$anonymous_docker_config/config.json"
          echo "DOCKER_CONFIG=$anonymous_docker_config" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/$repository" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Verify anonymous public pull metadata and exact digest
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          token="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull" \
            | jq -r '.token')"
          test -n "$token"
          actual_digest="$(curl --fail --silent --show-error --head \
            --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${repository}/manifests/${IMAGE_TAG}" \
            | tr -d '\r' \
            | awk -F ': ' 'tolower($1) == "docker-content-digest" {print $2}')"
          test "$actual_digest" = "$IMAGE_DIGEST"

      - name: Install Cosign without registry login
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify the keyless workflow identity
        shell: bash
        run: |
          set -euo pipefail
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/material-graph-image.yml@refs/heads/main"
          for attempt in 1 2 3 4 5; do
            if cosign verify \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${IMAGE_NAME}@${IMAGE_DIGEST}" >/dev/null; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
