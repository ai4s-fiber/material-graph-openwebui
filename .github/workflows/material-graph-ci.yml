name: Material Graph CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: material-graph-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pipe, Vitest, and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Pipe test runner
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2" "httpx==0.28.1" "pydantic==2.12.5"

      - name: Run Material Graph integration and release contract tests
        run: >-
          python -m pytest
          test/integrations/test_material_graph_pipe.py
          test/integrations/test_material_graph_release_contract.py
          -q

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frozen frontend dependencies
        run: npm ci --force

      - name: Run Material Graph Vitest suite
        run: npm run test:frontend -- --run src/lib/components/chat/MaterialGraph/tests

      - name: Build production frontend
        run: npm run build

  container-security:
    name: Production image and Grype gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build production image locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: material-graph-openwebui:ci-${{ github.sha }}
          build-args: |
            BUILD_HASH=${{ github.sha }}
            UID=10001
            GID=10001
            UV_VERSION=0.11.32
          provenance: false
          sbom: false
          cache-from: type=gha,scope=openwebui-secure-image
          cache-to: type=gha,mode=max,scope=openwebui-secure-image

      - name: Verify the minimal non-root runtime contract
        shell: bash
        run: |
          set -euo pipefail
          image="material-graph-openwebui:ci-${GITHUB_SHA}"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001:10001"
          docker run --rm --entrypoint sh "$image" -ec '
            test "$(id -u)" = 10001
            test "$(id -g)" = 10001
            for command in git curl jq ffmpeg gcc make cargo rustc; do
              ! command -v "$command"
            done
            ! python -m pip --version
            python -c "import aiohttp, fastapi, orjson, pgvector, psycopg, pydantic, sqlalchemy; from lxml import etree; assert psycopg.pq.__impl__ == 'c'"
          '

      - name: Smoke-test the production application
        shell: bash
        run: |
          set -euo pipefail
          image="material-graph-openwebui:ci-${GITHUB_SHA}"
          container="material-graph-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logs "$container" 2>/dev/null || true
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "$container" \
            --publish 127.0.0.1:18080:8080 \
            "$image"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/health \
              | python -c "import json, sys; assert json.load(sys.stdin).get('status') is True"; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container" | grep -qx true; then
              exit 1
            fi
            sleep 2
          done
          exit 1

      - name: Block high and critical vulnerabilities with Grype
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: material-graph-openwebui:ci-${{ github.sha }}
          severity-cutoff: high
          fail-build: true
          only-fixed: false
          output-format: table
