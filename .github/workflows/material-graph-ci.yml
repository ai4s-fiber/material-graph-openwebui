name: Material Graph CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: material-graph-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pipe, Vitest, and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Pipe test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run Material Graph Pipe tests
        run: python -m pytest test/integrations/test_material_graph_pipe.py -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frozen frontend dependencies
        run: npm ci --force

      - name: Run Material Graph Vitest suite
        run: npm run test:frontend -- --run src/lib/components/chat/MaterialGraph/tests

      - name: Build production frontend
        run: npm run build