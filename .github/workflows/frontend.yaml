# ─────────────────────────────────────────────────────────────────────────────
# Frontend CI — Lint, format check, build, and unit tests
# Runs on pushes and PRs to main/dev, skipping backend-only changes
# ─────────────────────────────────────────────────────────────────────────────
name: Frontend Build

on:
  push:
    branches: [main, dev]
    paths-ignore: ['backend/**', 'pyproject.toml', 'uv.lock']
  pull_request:
    branches: [main, dev]
    paths-ignore: ['backend/**', 'pyproject.toml', 'uv.lock']

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Project-owned formatting and full production build ───────────────────
  format-and-build:
    name: Format & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --force

      - name: Verify Material Graph formatting
        run: |
          npx prettier --check \
            ".github/workflows/frontend.yaml" \
            ".github/workflows/material-graph-ci.yml" \
            ".github/workflows/material-graph-image.yml" \
            "cypress/e2e/material-graph.cy.ts" \
            "docs/container-publishing.md" \
            "docs/superpowers/plans/2026-07-27-openwebui-release-hardening.md" \
            "src/lib/components/chat/MaterialGraph/**/*.{ts,svelte}" \
            "src/lib/components/chat/Messages/ResponseMessage/AssistantForm.{ts,svelte}" \
            "src/routes/material-graph-preview/+page.svelte"

      - name: Production build
        run: npm run build

  # ── Vitest unit tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies (frozen lockfile)
        run: npm ci --force

      - name: Execute test suite
        run: npm run test:frontend
